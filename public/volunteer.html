<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Volunteer - Blood4Everyone</title>

  <!-- Bootstrap & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/public/css/style.css" />
</head>
<body>
  <div id="header"></div>

  <div class="container py-5">
    <h2 class="text-center text-danger mb-4">Become a Volunteer</h2>

    <!-- Volunteer Form -->
    <form id="volunteerForm" class="row g-3 shadow p-4 bg-white rounded">
      <div class="col-md-6">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name" required />
      </div>
      <div class="col-md-6">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required />
      </div>
      <div class="col-md-6">
        <label for="phone" class="form-label">Phone</label>
        <input type="text" class="form-control" id="phone" required />
      </div>
      <div class="col-md-6">
        <label for="city" class="form-label">City</label>
        <input type="text" class="form-control" id="city" required />
      </div>
      <div class="col-12">
        <label for="interest" class="form-label">Area of Interest</label>
        <input type="text" class="form-control" id="interest" required />
      </div>
      <div class="col-12 text-end">
        <button type="submit" class="btn btn-danger px-4">Submit</button>
      </div>
    </form>

    <hr class="my-5"/>

    <!-- Volunteer Table -->
    <h3 class="text-center text-danger mb-4">Registered Volunteers</h3>
    <div class="table-responsive">
      <table class="table table-bordered table-striped text-center shadow-sm bg-white bg-opacity-75">
        <thead class="table-danger">
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>City</th>
            <th>Contact</th>
            <th>Interest</th>
          </tr>
        </thead>
        <tbody id="volunteerTableBody">
          <!-- Data will load here -->
        </tbody>
      </table>
    </div>
  </div>

  <div id="footer"></div>

  <script src="/public/js/layout.js"></script>
  <script src="/public/js/volunteerForm.js"></script>
  <script src="/public/js/volunteerTable.js"></script>
</body>
</html>
