<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Donate Blood - Blood4Everyone</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/public/css/style.css" />
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <!-- Dynamic Header -->
  <div id="header"></div>

  <main class="container py-5">
    <!-- Donor Registration Form -->
    <div class="glass-card p-4 shadow-lg">
      <h2 class="glass-heading text-center mb-4">Register as a Donor</h2>
      <form id="donorForm" class="row g-3">
        <div class="col-md-6">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <div class="col-md-6">
          <label for="bloodType" class="form-label">Blood Group</label>
          <select id="bloodType" name="bloodType" class="form-select" required>
            <option value="">Select</option>
            <option>A+</option><option>A-</option>
            <option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option>
            <option>O+</option><option>O-</option>
          </select>
        </div>
        <div class="col-md-6">
          <label for="city" class="form-label">City</label>
          <input type="text" class="form-control" id="city" name="city" required>
        </div>
        <div class="col-md-6">
          <label for="mobile" class="form-label">Mobile Number</label>
          <input type="tel" class="form-control" id="mobile" name="mobile" required>
        </div>
        <div class="col-md-6">
          <label for="pincode" class="form-label">Pincode</label>
          <input type="text" class="form-control" id="pincode" name="pincode" required>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-danger" id="submitBtn">Submit</button>
          <button type="button" class="btn btn-warning d-none" id="updateBtn">Update</button>
        </div>
      </form>
    </div>

    <!-- Donor Search & Table -->
    <div class="glass-card p-4 shadow-lg mt-5">
      <h3 class="glass-heading text-danger mb-4">Search Donors</h3>
      <form class="row g-3 align-items-end mb-3">
        <div class="col-12 col-md-6 col-lg-5">
          <label for="searchBloodType" class="form-label">Blood Group</label>
          <select id="searchBloodType" class="form-select">
            <option value="">All</option>
            <option>A+</option><option>A-</option>
            <option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option>
            <option>O+</option><option>O-</option>
          </select>
        </div>
        <div class="col-12 col-md-6 col-lg-5">
          <label for="searchCity" class="form-label">City</label>
          <input type="text" id="searchCity" class="form-control" placeholder="Enter city">
        </div>
        <div class="col-12 col-lg-2 d-grid">
          <label class="form-label invisible">Search</label>
          <button class="btn btn-outline-danger" type="button" onclick="searchDonors()">Search</button>
        </div>
      </form>

      <div class="table-responsive">
        <table id="donorTable" class="table table-bordered table-hover table-striped glass-table align-middle text-center">
          <thead class="table-danger">
            <tr>
              <th>Name</th>
              <th>Blood Group</th>
              <th>City</th>
              <th>Mobile</th>
              <th>Call</th>
              <th>Edit</th>
              <th>Map</th>
            </tr>
          </thead>
          <tbody>
            <!-- Donor data will be dynamically injected via donorTable.js -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Dynamic Footer -->
  <div id="footer"></div>

  <!-- JS Files -->
  <script src="/public/js/layout.js"></script>
  <script src="/public/js/donorTable.js"></script>
</body>
</html>
