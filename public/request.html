<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blood Requests - Blood4Everyone</title>

  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/public/css/style.css" />
</head>
<body class="d-flex flex-column min-vh-100">
  <div id="header"></div>

  <div class="container py-5">
    <h2 class="text-center mb-4 glass-heading">Request Blood</h2>

    <!-- Request Form -->
    <form id="requestForm" class="glass-card p-4 mb-4 shadow">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Name</label>
          <input type="text" name="name" class="form-control" required />
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input type="tel" name="phone" class="form-control" required />
        </div>
        <div class="col-md-4">
          <label class="form-label">Blood Group</label>
          <select name="bloodType" class="form-select" required>
            <option value="">Select</option>
            <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Units Needed</label>
          <input type="number" name="units" min="1" class="form-control" required />
        </div>
        <div class="col-md-4">
          <label class="form-label">Hospital Name</label>
          <input type="text" name="hospital" class="form-control" required />
        </div>
        <div class="col-md-12">
          <label class="form-label">Location</label>
          <input type="text" name="location" class="form-control" required />
        </div>
        <div class="col-12">
          <label class="form-label">Additional Details</label>
          <textarea name="details" class="form-control" rows="3" placeholder="Any other info..."></textarea>
        </div>
        <div class="col-12 text-center">
          <button type="submit" class="btn btn-danger btn-lg shadow">Submit Request</button>
        </div>
      </div>
    </form>

    <!-- Alert -->
    <div id="requestAlert" class="alert alert-success d-none text-center" role="alert">
      Request submitted successfully!
    </div>

    <!-- Table -->
    <h3 class="text-center text-danger mt-5 mb-3">Recent Blood Requests</h3>
    <div class="table-responsive glass-card">
      <table id="requestTable" class="table table-bordered table-hover text-center glass-table">
        <thead class="table-danger">
          <tr>
            <th>Name</th>
            <th>Blood Group</th>
            <th>Units</th>
            <th>Hospital</th>
            <th>Location</th>
            <th>Phone</th>
            <th>Time</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div id="footer"></div>

  <!-- JS -->
  <script src="/public/js/layout.js"></script>
  <script src="/public/js/requestTable.js"></script>
</body>
</html>
